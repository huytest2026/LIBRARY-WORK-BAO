<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Ca Trực & Cáp Quang</title>
</head>
<body>

    <!-- Giao diện mẫu để gọi hàm loadData -->
    <button onclick="loadData()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Tải Dữ Liệu Số Hóa</button>
    
    <!-- Nơi hiển thị kết quả tải về -->
    <div id="resultDiv" style="margin-top: 20px; font-family: Arial, sans-serif;"></div>

    <!-- BẮT BUỘC PHẢI CÓ THẺ <script> ĐỂ TRÌNH DUYỆT HIỂU VÀ CHẠY CODE -->
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGLPb-H13bWkldmsiOTU7zc6NMGpY23IB27K6UlJ_iK4U6uyKZLjchGg8V7C6T0p82/exec"; 

        function loadData() {
            document.getElementById('resultDiv').innerHTML = '⏳ Đang tải dữ liệu số hóa tuyến cáp...';
            
            fetch(GOOGLE_SCRIPT_URL + '?action=getData')
                .then(response => response.json())
                .then(res => { 
                    if (res.success) { 
                        let html = '<ul>';
                        res.data.forEach(item => { 
                            html += `<li>Tuyến: ${item.tuyenCap} - Trạm: ${item.tramQuanLy}</li>`;
                        }); 
                        html += '</ul>';
                        document.getElementById('resultDiv').innerHTML = html; 
                    } else { 
                        document.getElementById('resultDiv').innerHTML = '<p style="color:red">❌ Lỗi: ' + res.error + '</p>'; 
                    } 
                })
                .catch(err => { 
                    document.getElementById('resultDiv').innerHTML = '<p style="color:red">❌ Lỗi kết nối: ' + err + '</p>'; 
                });
        }
    </script>

</body>
</html>
